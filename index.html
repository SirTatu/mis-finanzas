<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,mon='ARS')=>{try{return new Intl.NumberFormat('es-AR',{style:'currency',currency:/^[A-Z]{3}$/.test(mon||'')?mon:'ARS',maximumFractionDigits:2}).format(n)}catch(e){return (mon||'ARS')+' '+Number(n||0).toFixed(2)}};
const monedasDisponibles=()=>Array.from(new Set(['ARS','USD','EUR','BRL','CLP'].concat((S.movs||[]).map(m=>m.moneda||'ARS'),(S.cuentas||[]).map(c=>c.moneda||'ARS')))).sort();
const pad=n=>String(n).padStart(2,'0');
const ymd=iso=>iso.split('-').map(Number);
const hoy=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const addDays=(iso,n)=>{const[a,m,d]=ymd(iso);return new Date(Date.UTC(a,m-1,d+n)).toISOString().slice(0,10)};
const addMonths=(iso,n)=>{const[a,m,d]=ymd(iso);const f=new Date(Date.UTC(a,m-1+n,1));const u=new Date(Date.UTC(f.getUTCFullYear(),f.getUTCMonth()+1,0)).getUTCDate();return f.getUTCFullYear()+'-'+pad(f.getUTCMonth()+1)+'-'+pad(Math.min(d,u))};
const dias=(a,b)=>{const u=s=>{const[y,m,d]=ymd(s);return Date.UTC(y,m-1,d)};return Math.round((u(a)-u(b))/864e5)};
const okISO=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(Date.parse(s));

function guardarMov(){
  const f=V.f,monto=num(f.monto),n=Math.floor(Number(f.cuotas)||1);
  if(!Number.isFinite(monto)||monto===0){V.err='Ingresá un importe distinto de cero.';return}
  if(!f.desc.trim()){V.err='Escribí una descripción.';return}
  if(!okISO(f.fecha)){V.err='La fecha no es válida.';return}
  const pagos=pagoOpciones(f.tipo).map(o=>o[0]);
  const pago=pagos.indexOf(f.pago)>-1?f.pago:pagos[0];
  if(!pago){V.err='Primero agregá un medio de pago en Ajustes.';return}
  const esAjusteTarjeta=monto<0&&f.tipo==='Gasto'&&pago.indexOf('tarjeta:')===0;
  if(monto<0&&!esAjusteTarjeta){V.err='Los importes negativos solo se permiten para reintegros o ajustes de gastos en tarjetas.';return}
  const cuotas=esAjusteTarjeta?1:((f.tipo==='Gasto'&&pago.indexOf('tarjeta:')===0)?n:1);
  if(cuotas<1||cuotas>48){V.err='Las cuotas van de 1 a 48.';return}
  const moneda=(f.moneda||'ARS').toUpperCase();if(!/^[A-Z]{3}$/.test(moneda)){V.err='La moneda debe ser un código de 3 letras, por ejemplo ARS, USD o EUR.';return}if(pago.indexOf('tarjeta:')===0&&moneda!=='ARS'){V.err='Por ahora los consumos de tarjetas se registran en ARS. Para otra moneda usá otro medio de pago y registrá la conversión en la cuenta.';return}const base={tipo:f.tipo,pago:pago,cat:f.cat,moneda:moneda};
  const d=f.desc.trim();
  if(f.editId){
    const m=S.movs.find(x=>x.id===f.editId);
    if(!m){V.err='No encontré el movimiento que querés editar.';return}
    Object.assign(m,{tipo:f.tipo,pago:pago,cat:f.cat,desc:d,fecha:f.fecha,monto:Math.round(monto*100)/100,moneda:moneda});
  }else if(cuotas===1){S.movs.push(Object.assign({id:uid(),fecha:f.fecha,desc:d,monto:Math.round(monto*100)/100,moneda:moneda},base))}
  else{
    const g=uid(),tot=Math.round(monto*100),b=Math.floor(tot/cuotas);let ac=0;
    for(let i=0;i<cuotas;i++){const c=i===cuotas-1?tot-ac:b;ac+=c;
      S.movs.push(Object.assign({id:uid(),grupo:g,fecha:addMonths(f.fecha,i),desc:d+' C '+pad(i+1)+'/'+pad(cuotas),monto:c/100,moneda:moneda},base));}
  }
  save();V.mes=f.fecha.slice(0,7);if(V.fijoPago){const ff=S.fijos.find(z=>z.id===V.fijoPago);if(ff){ff.ult=f.fecha.slice(0,7);save()}V.fijoPago=null}if(V.vtoPago){const vv=S.vtos.find(z=>z.id===V.vtoPago);if(vv)vv.hecho=true;V.vtoPago=null;save()}V.toast=alertaPres(f.tipo,f.cat,f.fecha.slice(0,7),f.pago,moneda);V.sheet=null;V.f=null;V.err='';
}
function guardarTar(){
  const c=V.c;
  if(!c.nombre.trim()){V.err='Escribí el nombre de la tarjeta.';return}
  if(!okISO(c.anterior)||!okISO(c.cierre)){V.err='Cargá el cierre anterior y el cierre actual.';return}
  if(c.cierre<=c.anterior){V.err='El cierre actual tiene que ser posterior al cierre anterior.';return}
  if(c.vencimiento&&!okISO(c.vencimiento)){V.err='La fecha de vencimiento no es válida.';return}
  const t={id:c.id||uid(),nombre:c.nombre.trim(),anterior:c.anterior,cierre:c.cierre,vencimiento:c.vencimiento||''};
  const i=S.tarjetas.findIndex(x=>x.id===t.id);
  if(i>-1)S.tarjetas[i]=t;else S.tarjetas.push(t);
  save();V.sheet=null;V.c=null;V.err='';
}

function guardarFijo(){
 const f=V.f,m=num(f.monto),dia=Math.floor(Number(f.dia));
 if(!f.desc.trim()){V.err='Escribí una descripción.';return}
 if(!(f.variable||m>0)){V.err='Ingresá un importe mayor que cero o marcá importe variable.';return}
 if(!(dia>=1&&dia<=31)){V.err='El día va de 1 a 31.';return}
 if(!f.pago){V.err='Primero agregá un medio de pago en Ajustes.';return}
 const h=hoy(),mes=h.slice(0,7),o={id:f.id||uid(),desc:f.desc.trim(),monto:f.variable?0:m,dia:dia,tipo:f.tipo,cat:f.cat,pago:f.pago,variable:!!f.variable,activo:f.activo!==false,ult:f.ult||''};
 const i=S.fijos.findIndex(x=>x.id===o.id);
 if(i<0&&h>venceFijo(o,mes))o.ult=mes;
 if(i>-1)S.fijos[i]=o;else S.fijos.push(o);
 save();V.sheet=null;V.f=null;V.err='';
}
const resTarj=t=>sumM(S.movs.filter(m=>m.tipo==='Gasto'&&m.pago==='tarjeta:'+t.id&&m.fecha>=addDays(t.anterior,1)&&m.fecha<=t.cierre));
/* ===================== PAGOS DE TARJETAS + ALERTA DE ÚLTIMO MOMENTO ===================== */
/* S.pagosTar = [{id,tid,cierre,venc,monto,estado:'pendiente'|'pagado',pagado,fecha,creado}]  (un registro por resumen)  */
const pagoTarRec=(tid,cierre)=>(S.pagosTar||[]).find(p=>p.tid===tid&&p.cierre===cierre);
function pendTar(){const out=[],h=hoy();
 S.tarjetas.forEach(t=>{const r=pagoTarRec(t.id,t.cierre),m=resTarj(t);if(!(r&&r.estado==='pagado')&&t.vencimiento&&m>0)out.push({tid:t.id,nombre:t.nombre,cierre:t.cierre,venc:t.vencimiento,monto:m,vigente:true,cerrado:t.cierre<h})});
 (S.pagosTar||[]).forEach(p=>{if(p.estado!=='pendiente')return;const t=S.tarjetas.find(z=>z.id===p.tid);if(!t||p.cierre===t.cierre||!(p.monto>0))return;out.push({tid:p.tid,nombre:t.nombre,cierre:p.cierre,venc:p.venc,monto:p.monto,vigente:false,cerrado:true})});
 return out.sort((a,b)=>a.venc.localeCompare(b.venc))}
/* lo que sale por tarjetas, para la proyección: [fecha, importe]. El resumen pagado queda fijo; el no pagado sigue restando aunque pase el vencimiento. */
function flujosTar(){const out=[];
 S.tarjetas.forEach(t=>{const r=pagoTarRec(t.id,t.cierre);if(r&&r.estado==='pagado')out.push([r.fecha||r.pagado,r.monto]);else if(t.vencimiento)out.push([t.vencimiento,resTarj(t)])});
 (S.pagosTar||[]).forEach(p=>{const t=S.tarjetas.find(z=>z.id===p.tid);if(t&&p.cierre===t.cierre)return;if(!t&&p.estado==='pendiente')return;out.push([p.estado==='pagado'?(p.fecha||p.pagado):p.venc,p.monto])});
 return out.filter(x=>x[0]&&x[1])}
function pagarTar(tid,cierre,monto,fecha){const t=S.tarjetas.find(z=>z.id===tid);if(!t)return;S.pagosTar=S.pagosTar||[];let r=pagoTarRec(tid,cierre);
 if(!r){r={id:uid(),tid:tid,cierre:cierre,venc:cierre===t.cierre?(t.vencimiento||''):'',monto:0,estado:'pendiente',pagado:'',fecha:'',creado:hoy()};S.pagosTar.push(r)}
 r.monto=Math.round(monto*100)/100;r.estado='pagado';r.pagado=fecha;r.fecha=(r.venc&&r.venc<fecha)?r.venc:fecha;save()}
function avanzarCiclo(t){let pend=false;const m=Math.round(resTarj(t)*100)/100,r=pagoTarRec(t.id,t.cierre);
 if(t.vencimiento&&m>0&&!(r&&r.estado==='pagado')){S.pagosTar=S.pagosTar||[];if(r){r.monto=m;r.venc=t.vencimiento;r.estado='pendiente'}else S.pagosTar.push({id:uid(),tid:t.id,cierre:t.cierre,venc:t.vencimiento,monto:m,estado:'pendiente',pagado:'',fecha:'',creado:hoy()});pend=true}
 t.anterior=t.cierre;t.cierre=addMonths(t.cierre,1);if(t.vencimiento)t.vencimiento=addMonths(t.vencimiento,1);save();return pend}
function estadoPagoTar(t,h,cerrado){const r=pagoTarRec(t.id,t.cierre);let o='';

 (S.pagosTar||[]).filter(p=>p.tid===t.id&&p.estado==='pendiente'&&p.cierre!==t.cierre&&p.monto>0).forEach(p=>{o+=`<div class="row"><span><b class="out">Pendiente</b> · resumen con cierre ${fd(p.cierre)}<br><small class="mut">${p.venc?'Venció el '+fd(p.venc)+' · ':''}${fmt(p.monto)}</small></span><button class="lnk" data-a="pagarTarAbrir" data-id="${t.id}" data-c="${p.cierre}">Pagado</button></div>`});
 return o}

 try{if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration){navigator.serviceWorker.getRegistration().then(r=>{if(r&&r.showNotification)r.showNotification(titulo,{body:cuerpo,tag:'mf-ultimo-momento',requireInteraction:true,icon:'icon-192.png'});else new Notification(titulo,{body:cuerpo})}).catch(()=>{try{new Notification(titulo,{body:cuerpo})}catch(e){}})}else new Notification(titulo,{body:cuerpo});return true}catch(e){return false}}
function chequearAlerta(){try{if(!alertaActiva())return;const L=pendHoy();if(!L.length)return;const h=hoy();let reg={};try{reg=JSON.parse(localStorage.getItem('mf_alerta_v1'))||{}}catch(e){}
 if(reg.f!==h)reg={f:h,k:[]};const nuevas=L.filter(x=>reg.k.indexOf(x.k)<0);if(!nuevas.length)return;
 notificarLocal('⚠️ Pago sin confirmar','Todavía no confirmaste: '+nuevas.map(x=>x.t+(x.m>0?' ('+fmt(x.m)+')':'')).join(', ')+'.');

 if(!V.sheet&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))render()}catch(e){}}
function ajAlertaUltima(){const a=S.alerta||{on:false,hora:'20:00'},pm=('Notification' in window)?Notification.permission:'no';

function agendaItems(maxDias){
 const h=hoy(),it=[];
 S.tarjetas.forEach(t=>{const r=resTarj(t),rec=pagoTarRec(t.id,t.cierre),pag=rec&&rec.estado==='pagado';
  if(t.cierre>=h&&dias(t.cierre,h)<=maxDias)it.push({f:t.cierre,t:'Cierre - '+t.nombre,d:'llevás '+fmt(r)});
  if(t.vencimiento&&!pag&&(t.vencimiento<h?r>0:dias(t.vencimiento,h)<=maxDias))it.push({f:t.vencimiento,t:'Vencimiento - '+t.nombre,d:'resumen de '+fmt(r),tid:t.id,c:t.cierre})});
 (S.pagosTar||[]).forEach(p=>{if(p.estado!=='pendiente')return;const t=S.tarjetas.find(z=>z.id===p.tid);if(!t||p.cierre===t.cierre||!(p.monto>0))return;if(p.venc<h||dias(p.venc,h)<=maxDias)it.push({f:p.venc,t:'Vencimiento - '+t.nombre,d:'resumen de '+fmt(p.monto),tid:p.tid,c:p.cierre})});
 S.vtos.forEach(v=>{if(v.hecho)return;if(v.fecha<h||dias(v.fecha,h)<=maxDias)it.push({f:v.fecha,t:v.desc,d:v.monto>0?fmt(v.monto):'',vid:v.id})});
 return it.sort((a,b)=>a.f.localeCompare(b.f));
}

function comandoPagoTar(tx,t){
 if(!/\b(pague|pago|abone|cancele|salde|pagamos)\b/.test(t)||!/\bresumen\b/.test(t))return null;
 const say=(m,x)=>{V.chat.push(Object.assign({r:'b',t:m},x||{}));return true},tj=tjEn(t);

 R.log=R.log||{};const lg=R.log[fecha];if(lg){lg.por=lg.por||{};const anterior=Number(lg.por[id])||0,nuevo=Math.round(valor*100)/100;lg.por[id]=nuevo;lg.rend=Math.round(((Number(lg.rend)||0)-anterior+nuevo)*100)/100;const delta=nuevo-anterior;Object.keys(R.log).filter(f=>f>fecha).sort().forEach(f=>{if(R.log[f].saldo!=null)R.log[f].saldo=Math.round((R.log[f].saldo+delta)*100)/100})}
 save();V.toast='Rendimiento de '+fd(fecha)+' actualizado.';render();
