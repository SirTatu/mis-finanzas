<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0e6b66">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Mis finanzas</title>
<style>
:root{--bg:#eef1ee;--panel:#fff;--ink:#17262b;--mut:#5b6b70;--line:#d5dcd8;--acc:#0e6b66;--onacc:#fff;--out:#a63a2e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a1c;--panel:#172326;--ink:#e6eeec;--mut:#93a5a6;--line:#25363a;--acc:#4db6ac;--onacc:#0b1a1b;--out:#e58a7b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101a1c;--panel:#172326;--ink:#e6eeec;--mut:#93a5a6;--line:#25363a;--acc:#4db6ac;--onacc:#0b1a1b;--out:#e58a7b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 18px 150px}
h1{font-size:22px;font-weight:650;margin:0;text-transform:capitalize}
h2{font-size:17px;font-weight:650;margin:28px 0 8px}
p{margin:0 0 6px}
.mut{color:var(--mut)}.num{font-variant-numeric:tabular-nums}.in{color:var(--acc)}.out{color:var(--out)}
.big{font-size:46px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:0 0 14px}
.big2{font-size:28px;font-weight:700;letter-spacing:-.01em;margin:2px 0}
.two{display:flex;gap:32px;margin-bottom:6px}.two p{margin:0}.two .num{font-size:20px;font-weight:600}
.mes{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
button{font:inherit;color:inherit;cursor:pointer}
.ic{background:none;border:0;font-size:28px;line-height:1;padding:6px 14px;color:var(--mut)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.mv{width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;align-items:flex-start}
.mv small{font-size:13px}
.bar{padding:7px 0}.bl{display:flex;justify-content:space-between;gap:10px}.bt{height:6px;background:var(--line);border-radius:3px;margin-top:5px;overflow:hidden}.bt i{display:block;height:100%;background:var(--acc)}
.tar{padding:6px 0 20px;border-bottom:1px solid var(--line);margin-bottom:18px}
.warn{color:var(--out);font-weight:600}
.lnk{background:none;border:0;color:var(--acc);font-weight:600;padding:8px 0}
.btn{display:block;width:100%;min-height:46px;margin-top:10px;border:0;border-radius:12px;background:var(--acc);color:var(--onacc);font-weight:650}
.btn.sec{background:none;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--out);color:var(--bg)}.btn.danger.sec{background:none;color:var(--out);border-color:var(--out)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;min-height:52px;background:none;border:0;color:var(--mut);font-size:12px;padding:0 2px}
.tabs button[aria-current]{color:var(--acc);font-weight:700}
.fab{position:fixed;right:18px;bottom:calc(66px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--acc);color:var(--onacc);font-size:32px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:5}
.sh{position:fixed;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;z-index:6;background:var(--panel);border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto}
label{display:block;margin:12px 0 0;font-size:14px;color:var(--mut)}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:11px 12px;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px}
textarea{min-height:90px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}.seg button{flex:1;min-height:44px;background:none;border:0;font-weight:600;color:var(--mut)}.seg button[aria-pressed]{background:var(--acc);color:var(--onacc)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chip{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 12px;border:1.5px solid var(--line);border-radius:20px}.chip button{background:none;border:0;color:var(--mut);font-size:16px;padding:0 6px}
.add{display:flex;gap:8px}.add input{margin:0}.add .btn{width:auto;margin:0;padding:0 18px}
.tb{display:grid;grid-template-columns:1.1fr 1fr .9fr 1.2fr;gap:6px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.tb span+span{text-align:right}.th{color:var(--mut);font-size:12px}.dias{display:flex;gap:6px;margin-top:6px}.dias button{flex:1;min-height:42px;border:1.5px solid var(--line);border-radius:10px;background:none;font-weight:600;color:var(--mut)}.dias button[aria-pressed],.tg[aria-pressed]{background:var(--acc);color:var(--onacc);border-color:var(--acc)}.tg{background:none;padding:6px 14px}.ws{overflow-x:auto;margin:0 -18px;padding:0 18px}.tt{border-collapse:collapse;font-size:13px;white-space:nowrap}.tt th,.tt td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--line)}.tt th{color:var(--mut);font-weight:600;font-size:12px}.tt th:first-child,.tt td:first-child{text-align:left;position:sticky;left:0;background:var(--bg)}.ch{display:flex;flex-direction:column;gap:10px;margin-top:14px;padding-bottom:70px}.bb{max-width:86%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;line-height:1.35}.bb.u{align-self:flex-end;background:var(--acc);color:var(--onacc)}.bb.b{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}.ba{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.ba .btn{width:auto;min-height:40px;margin:0;padding:0 14px}.cb{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:640px;bottom:calc(52px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--bg);border-top:1px solid var(--line);z-index:3}.cb input{margin:0}.cb .btn{width:auto;margin:0;padding:0 16px}.toast{position:sticky;top:0;z-index:4;background:var(--acc);color:var(--onacc);padding:10px 18px;font-weight:600}.fj{border:1.5px solid var(--acc);border-radius:12px;padding:6px 14px;margin-bottom:16px}.fj .row:last-child{border-bottom:0}.fj .lnk{padding:8px 10px}.add select{margin:0;width:auto;flex:1}:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:2}).format(n);
const pad=n=>String(n).padStart(2,'0');
const ymd=iso=>iso.split('-').map(Number);
const hoy=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const addDays=(iso,n)=>{const[a,m,d]=ymd(iso);return new Date(Date.UTC(a,m-1,d+n)).toISOString().slice(0,10)};
const addMonths=(iso,n)=>{const[a,m,d]=ymd(iso);const f=new Date(Date.UTC(a,m-1+n,1));const u=new Date(Date.UTC(f.getUTCFullYear(),f.getUTCMonth()+1,0)).getUTCDate();return f.getUTCFullYear()+'-'+pad(f.getUTCMonth()+1)+'-'+pad(Math.min(d,u))};
const dias=(a,b)=>{const u=s=>{const[y,m,d]=ymd(s);return Date.UTC(y,m-1,d)};return Math.round((u(a)-u(b))/864e5)};
const okISO=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(Date.parse(s));
const fd=iso=>iso.slice(8,10)+'/'+iso.slice(5,7);
const rel=n=>n===0?'hoy':n===1?'mañana':n===-1?'ayer':n>1?'en '+n+' días':'hace '+(-n)+' días';
const num=s=>{s=String(s).trim();if(s.indexOf(',')>-1)s=s.replace(/\./g,'').replace(',','.');else if(!/^\d+\.\d{1,2}$/.test(s))s=s.replace(/\./g,'');return Number(s)};
const sumM=a=>a.reduce((t,m)=>t+m.monto,0);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

const K='finanzas_v1';
let S,V={tab:'res',mes:hoy().slice(0,7),sheet:null,f:null,c:null,w:null,s:null,largo:false,id:null,err:'',msg:'',pend:null,ctx:'',foco:false,rmes:hoy().slice(0,7),chat:[{r:'b',t:'Escribime un gasto o ingreso y lo registro. Por ejemplo: “Gasté 12500 en el súper con débito” o “Cobré 900000 de sueldo por transferencia”. También podés cargarlo a mano con el botón ＋.'}]};
function load(){
  try{S=JSON.parse(localStorage.getItem(K))}catch(e){S=null}
  if(!S||!Array.isArray(S.movs))S={tarjetas:[],medios:['Efectivo','Débito','Transferencia'],categorias:['Supermercado','Transporte','Salidas','Servicios','Salud','Hogar','Otros'],movs:[]};
  S.tarjetas=S.tarjetas||[];S.medios=S.medios||[];S.categorias=S.categorias||[];S.catIng=S.catIng||['Sueldo','Ventas','Otros ingresos'];S.pres=S.pres||{};S.fijos=S.fijos||[];S.vtos=S.vtos||[];S.bor=S.bor||[];
}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}if(window.marcarSucio)window.marcarSucio()};
const tomb=ids=>{S.bor=(S.bor||[]).concat(ids)};

const pagoNombre=p=>p.indexOf('tarjeta:')===0?((S.tarjetas.find(t=>'tarjeta:'+t.id===p)||{}).nombre||'(tarjeta eliminada)'):p.slice(6);
const pagoOpciones=tipo=>(tipo==='Gasto'?S.tarjetas.map(t=>['tarjeta:'+t.id,t.nombre]):[]).concat(S.medios.map(m=>['medio:'+m,m]));
const nuevoForm=()=>({tipo:'Gasto',monto:'',desc:'',cat:S.categorias[0]||'',pago:'',fecha:hoy(),cuotas:'1'});

function guardarMov(){
  const f=V.f,monto=num(f.monto),n=Math.floor(Number(f.cuotas)||1);
  if(!(monto>0)){V.err='Ingresá un importe mayor que cero.';return}
  if(!f.desc.trim()){V.err='Escribí una descripción.';return}
  if(!okISO(f.fecha)){V.err='La fecha no es válida.';return}
  const pagos=pagoOpciones(f.tipo).map(o=>o[0]);
  const pago=pagos.indexOf(f.pago)>-1?f.pago:pagos[0];
  if(!pago){V.err='Primero agregá un medio de pago en Ajustes.';return}
  const cuotas=(f.tipo==='Gasto'&&pago.indexOf('tarjeta:')===0)?n:1;
  if(cuotas<1||cuotas>48){V.err='Las cuotas van de 1 a 48.';return}
  const base={tipo:f.tipo,pago:pago,cat:f.cat};
  const d=f.desc.trim();
  if(cuotas===1){S.movs.push(Object.assign({id:uid(),fecha:f.fecha,desc:d,monto:monto},base))}
  else{
    const g=uid(),tot=Math.round(monto*100),b=Math.floor(tot/cuotas);let ac=0;
    for(let i=0;i<cuotas;i++){const c=i===cuotas-1?tot-ac:b;ac+=c;
      S.movs.push(Object.assign({id:uid(),grupo:g,fecha:addMonths(f.fecha,i),desc:d+' C '+pad(i+1)+'/'+pad(cuotas),monto:c/100},base));}
  }
  save();V.mes=f.fecha.slice(0,7);if(V.vtoPago){const vv=S.vtos.find(z=>z.id===V.vtoPago);if(vv)vv.hecho=true;V.vtoPago=null;save()}V.toast=alertaPres(f.tipo,f.cat,f.fecha.slice(0,7));V.sheet=null;V.f=null;V.err='';
}
function guardarTar(){
  const c=V.c;
  if(!c.nombre.trim()){V.err='Escribí el nombre de la tarjeta.';return}
  if(!okISO(c.anterior)||!okISO(c.cierre)){V.err='Cargá el cierre anterior y el cierre actual.';return}
  if(c.cierre<=c.anterior){V.err='El cierre actual tiene que ser posterior al cierre anterior.';return}
  if(c.vencimiento&&!okISO(c.vencimiento)){V.err='La fecha de vencimiento no es válida.';return}
  const t={id:c.id||uid(),nombre:c.nombre.trim(),anterior:c.anterior,cierre:c.cierre,vencimiento:c.vencimiento||''};
  const i=S.tarjetas.findIndex(x=>x.id===t.id);
  if(i>-1)S.tarjetas[i]=t;else S.tarjetas.push(t);
  save();V.sheet=null;V.c=null;V.err='';
}
function addTo(lista,id){const v=$(id).value.trim();if(v&&lista.indexOf(v)<0){lista.push(v);save()}}

const hMes=()=>{const[a,m]=ymd(V.mes+'-01');return `<div class="mes"><button class="ic" data-a="mes" data-d="-1" aria-label="Mes anterior">‹</button><h1>${esc(new Date(a,m-1,1).toLocaleDateString('es-AR',{month:'long',year:'numeric'}))}</h1><button class="ic" data-a="mes" data-d="1" aria-label="Mes siguiente">›</button></div>`};

function vRes(){
  const ms=S.movs.filter(m=>m.fecha.indexOf(V.mes)===0);
  const g=ms.filter(m=>m.tipo==='Gasto'),i=ms.filter(m=>m.tipo==='Ingreso');
  const porCat={},porPago={};
  g.forEach(m=>{const c=m.cat||'Sin categoría',p=pagoNombre(m.pago);porCat[c]=(porCat[c]||0)+m.monto;porPago[p]=(porPago[p]||0)+m.monto});const ingC={};i.forEach(m=>{const c=m.cat||'Sin categoría';ingC[c]=(ingC[c]||0)+m.monto});
  const barras=o=>{const k=Object.keys(o).sort((a,b)=>o[b]-o[a]),mx=o[k[0]]||1;
    return k.map(n=>`<div class="bar"><div class="bl"><span>${esc(n)}</span><span class="num">${fmt(o[n])}</span></div><div class="bt"><i style="width:${Math.max(3,o[n]/mx*100)}%"></i></div></div>`).join('')||'<p class="mut">Todavía no hay gastos este mes. Tocá + para cargar el primero.</p>'};
  return hMes()+bannerFijos()+bannerVence()+`<p class="mut">Gastado</p><p class="big num">${fmt(sumM(g))}</p><div class="two"><div><p class="mut">Ingresos</p><p class="num in">${fmt(sumM(i))}</p></div><div><p class="mut">Balance</p><p class="num">${fmt(sumM(i)-sumM(g))}</p></div></div>${presHtml(porCat)}<h2>Por categoría</h2>${barras(porCat)}<h2>Por medio de pago</h2>${barras(porPago)}${i.length?`<h2>Ingresos por categoría</h2>${barras(ingC)}`:''}${agendaHtml()}`;
}
function vMov(){
  const ms=S.movs.filter(m=>m.fecha.indexOf(V.mes)===0).reverse().sort((x,y)=>y.fecha.localeCompare(x.fecha));
  return hMes()+(ms.map(m=>`<button class="row mv" data-a="del" data-id="${m.id}"><span><b>${esc(m.desc)}</b><br><small class="mut">${esc(m.cat||'Ingreso')} · ${esc(pagoNombre(m.pago))} · ${fd(m.fecha)}</small></span><span class="num ${m.tipo==='Ingreso'?'in':'out'}">${m.tipo==='Ingreso'?'+':'−'}${fmt(m.monto)}</span></button>`).join('')||'<p class="mut">No hay movimientos en este mes.</p>');
}
function vTar(){
  const h=hoy();
  const lista=S.tarjetas.map(t=>{
    const desde=addDays(t.anterior,1);
    const en=(a,b)=>S.movs.filter(m=>m.tipo==='Gasto'&&m.pago==='tarjeta:'+t.id&&m.fecha>=a&&m.fecha<=b);
    const r=en(desde,t.cierre),cerrado=h>t.cierre,nuevo=cerrado?en(addDays(t.cierre,1),h):[];
    return `<section class="tar"><div class="row" style="border:0;padding-bottom:0"><b>${esc(t.nombre)}</b><button class="lnk" data-a="edTar" data-id="${t.id}">Editar</button></div>
<p>${cerrado?'Resumen cerrado el '+fd(t.cierre):'Resumen del '+fd(desde)+' al '+fd(t.cierre)}</p><p class="big2 num">${fmt(sumM(r))}</p><p class="mut">${r.length} movimiento(s)</p>
<p class="mut">${cerrado?'':'Cierra '+rel(dias(t.cierre,h))+'. '}${t.vencimiento?'Vence el '+fd(t.vencimiento)+' ('+rel(dias(t.vencimiento,h))+')':''}</p>
${t.vencimiento&&t.vencimiento<h?'<p class="warn">El vencimiento ya pasó: pasá la tarjeta al próximo ciclo.</p>':''}
${cerrado?`<p class="mut">Consumos nuevos desde el ${fd(addDays(t.cierre,1))}: <span class="num">${fmt(sumM(nuevo))}</span></p>`:''}
<button class="btn sec" data-a="ciclo" data-id="${t.id}">Pasar al próximo ciclo</button></section>`}).join('');
  return `<h1>Tarjetas</h1><p class="mut" style="margin-top:6px">Cada resumen va desde el día siguiente al cierre anterior hasta el cierre actual.</p>`+(lista||'<p style="margin-top:18px">Agregá tus tarjetas con sus fechas de cierre y vencimiento.</p>')+`<button class="btn" data-a="nuevaTar">Agregar tarjeta</button>${vtoList()}`;
}
const venceFijo=(f,mes)=>{const p=ymd(mes+'-01'),u=new Date(Date.UTC(p[0],p[1],0)).getUTCDate();return mes+'-'+pad(Math.min(f.dia,u))};
function fijosPend(){const h=hoy(),mes=h.slice(0,7);return S.fijos.filter(f=>f.activo!==false&&(f.ult||'')<mes&&h>=venceFijo(f,mes)).map(f=>Object.assign({},f,{mes:mes,vence:venceFijo(f,mes)}))}
function bannerFijos(){const p=fijosPend();if(!p.length)return '';return `<div class='fj'><b>Gastos fijos para registrar</b>${p.map(f=>`<div class='row'><span>${esc(f.desc)}<br><small class='mut'>${f.tipo==='Ingreso'?'+':''}${fmt(f.monto)} · ${esc(pagoNombre(f.pago))} · vence ${fd(f.vence)}</small></span><span><button class='lnk' data-a='regFijo' data-id='${f.id}'>Registrar</button><button class='lnk' data-a='saltarFijo' data-id='${f.id}'>Saltar</button></span></div>`).join('')}</div>`}
function alertaPres(tipo,cat,mes){if(tipo!=='Gasto'||!S.pres[cat])return '';const g=sumM(S.movs.filter(m=>m.tipo==='Gasto'&&m.cat===cat&&m.fecha.indexOf(mes)===0)),l=S.pres[cat],p=Math.round(g/l*100);return p>=100?'🚨 Superaste el presupuesto de '+cat+': '+fmt(g)+' de '+fmt(l):p>=80?'⚠️ Llevás el '+p+'% del presupuesto de '+cat+': '+fmt(g)+' de '+fmt(l):''}
function presHtml(porCat){const k=Object.keys(S.pres);if(!k.length)return '';return `<h2>Presupuestos</h2>`+k.map(c=>{const g=porCat[c]||0,l=S.pres[c],p=Math.round(g/l*100);return `<div class='bar'><div class='bl'><span>${p>=100?'🚨 ':p>=80?'⚠️ ':''}${esc(c)}</span><span class='num'>${fmt(g)} de ${fmt(l)} (${p}%)</span></div><div class='bt'><i style='width:${Math.min(100,p)}%;background:${p>=100?'var(--out)':p>=80?'#c98a00':'var(--acc)'}'></i></div></div>`}).join('')}
function ajPres(){const k=Object.keys(S.pres);return `<h2>Presupuestos mensuales</h2><p class='mut'>Límite por categoría de gasto. Te aviso en el Resumen y al cargar un gasto cuando llegués al 80% y al 100%.</p><div class='chips'>${k.map(c=>`<span class='chip'>${esc(c)}: ${fmt(S.pres[c])}<button data-a='rmPres' data-k='${esc(c)}' aria-label='Quitar'>✕</button></span>`).join('')||"<span class='mut'>Sin presupuestos</span>"}</div><div class='add'><select id='pC'>${S.categorias.map(c=>`<option value='${esc(c)}'>${esc(c)}</option>`).join('')}</select><input id='pM' inputmode='decimal' placeholder='Límite'><button class='btn' data-a='setPres'>Fijar</button></div>`}
function ajFijos(){return `<h2>Gastos fijos mensuales</h2><p class='mut'>Cada mes, desde su día, aparecen en el Resumen para registrarlos con un toque.</p>${S.fijos.map(f=>`<div class='row'><span><b>${esc(f.desc)}</b> · ${f.tipo==='Ingreso'?'+':''}${fmt(f.monto)}<br><small class='mut'>Día ${f.dia} · ${esc(pagoNombre(f.pago))}${f.activo===false?' · pausado':''}</small></span><button class='lnk' data-a='edFijo' data-id='${f.id}'>Editar</button></div>`).join('')}<button class='btn sec' data-a='nuevoFijo'>Agregar gasto fijo</button>`}
function sheetFijo(){
 const f=V.f,CL=f.tipo==='Gasto'?S.categorias:S.catIng,op=pagoOpciones(f.tipo);

    pagarVto:()=>{const v=S.vtos.find(z=>z.id===d.id);if(!v)return;const f={tipo:'Gasto',monto:v.monto>0?String(v.monto):'',desc:v.desc,cat:v.cat,pago:v.pago,fecha:hoy(),cuotas:'1'};if(!(v.monto>0)){V.f=f;V.sheet='mov';V.err='';V.vtoPago=v.id;V.toast='Completá el importe para registrarlo.';return}V.f=f;guardarMov();if(V.f){V.toast='No pude registrarlo: '+V.err;V.f=null;V.err='';return}v.hecho=true;save();V.toast=V.toast||'✅ Pagado: '+v.desc},
    nuevoFijo:()=>{V.f={tipo:'Gasto',monto:'',desc:'',cat:S.categorias[0]||'',pago:'',dia:'',id:null};V.sheet='fijo';V.err=''},
    edFijo:()=>{const x=S.fijos.find(z=>z.id===d.id);V.f=Object.assign({},x,{monto:String(x.monto),dia:String(x.dia)});V.sheet='fijo';V.err=''},
    guardarFijo:guardarFijo,
    pausaFijo:()=>{const x=S.fijos.find(z=>z.id===V.f.id);x.activo=(x.activo===false);save();V.sheet=null;V.f=null},
    delFijo:()=>{if(!V.f.conf){V.f.conf=true;return}tomb([V.f.id]);S.fijos=S.fijos.filter(z=>z.id!==V.f.id);save();V.sheet=null;V.f=null},
    regFijo:()=>{const p=fijosPend().find(z=>z.id===d.id);if(!p)return;V.f={tipo:p.tipo,monto:String(p.monto),desc:p.desc,cat:p.cat,pago:p.pago,fecha:p.vence,cuotas:'1'};guardarMov();if(V.f){V.toast='No pude registrarlo: '+V.err;V.f=null;V.err='';return}S.fijos.find(z=>z.id===p.id).ult=p.mes;save();V.toast=V.toast||'✅ Registrado: '+p.desc},
    saltarFijo:()=>{const p=fijosPend().find(z=>z.id===d.id);if(!p)return;S.fijos.find(z=>z.id===p.id).ult=p.mes;save();V.toast='⏭ Salteaste '+p.desc+' de este mes'},
    chatEnv:()=>{const i=$('#chatIn'),tx=i?i.value.trim():'';if(!tx)return;V.chat.push({r:'u',t:tx});procesarChat(tx);V.foco=true},
    chatOk:chatOkF,
    chatEd:()=>{const op=V.pend;if(!op)return;if(op.k)return chatEdCfg(op);V.f={tipo:op.tipo,monto:String(op.monto),desc:op.desc,cat:op.cat,pago:op.pago,fecha:op.fecha,cuotas:String(op.cuotas)};V.sheet='mov';V.err='';V.pend=null;V.chat.push({r:'b',t:'Lo abrí para que lo edites.'})},
    chatNo:()=>{V.pend=null;V.ctx='';V.chat.push({r:'b',t:'Cancelado. No registré nada.'})},
    addCI:()=>addTo(S.catIng,'#nCI'),
    rmCI:()=>{S.catIng.splice(Number(d.i),1);save()},
    addCat:()=>addTo(S.categorias,'#nCat'),
    rmCat:()=>{S.categorias.splice(Number(d.i),1);save()},
    addMed:()=>addTo(S.medios,'#nMed'),
    rmMed:()=>{S.medios.splice(Number(d.i),1);save()},
    copiar:()=>{const t=$('#exp');t.select();try{navigator.clipboard.writeText(t.value);V.msg='Datos copiados.'}catch(e){try{document.execCommand('copy');V.msg='Datos copiados.'}catch(e2){V.msg='Seleccioná el texto y copialo a mano.'}}},
    importar:()=>{try{const j=JSON.parse($('#imp').value);if(!j||!Array.isArray(j.movs)||!Array.isArray(j.tarjetas))throw 0;S={tarjetas:j.tarjetas,medios:j.medios||[],categorias:j.categorias||[],movs:j.movs,rend:j.rend||null,catIng:j.catIng||['Sueldo','Ventas','Otros ingresos'],pres:j.pres||{},fijos:j.fijos||[],vtos:j.vtos||[]};save();V.msg='Datos restaurados.'}catch(e){V.msg='No pude leer esos datos: pegá el texto copiado completo.'}}
  }[a];
  if(x){x();render()}
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;if(window.extraActs&&window.extraActs[t.dataset.a]){window.extraActs[t.dataset.a](t.dataset);render()}else act(t.dataset.a,t.dataset)});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.f&&V.f)V.f[t.dataset.f]=t.value;if(t.dataset.c&&V.c)V.c[t.dataset.c]=t.value;if(t.dataset.w&&V.w)V.w[t.dataset.w]=t.value;if(t.dataset.s&&V.s)V.s[t.dataset.s]=t.value});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.f&&V.f){V.f[t.dataset.f]=t.value;if(t.dataset.r)render()}if(t.dataset.w&&V.w){V.w[t.dataset.w]=t.value;if(t.dataset.r)render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='chatIn'){e.preventDefault();act('chatEnv',{})}});
load();render();
</script>
